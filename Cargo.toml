[workspace]
members = ["pawline-core", "pawline-needle", "pawline-native", "pawline-needle-native", "vendor/needle-rs/needle-core", "vendor/needle-rs/needle-infer"]
resolver = "2"
exclude = ["experiments"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true

# Single-codegen-unit optimization for Pawline's own crates only: dependencies
# stay at the default 16 because tract-core at 1 needs more RAM than a 2 GB
# build box has (SIGKILL during codegen, observed 2026-11-27).
[profile.release.package.pawline-native]
codegen-units = 1

[profile.release.package.pawline-core]
codegen-units = 1

[profile.release.package.pawline-needle]
codegen-units = 1

[profile.release.package.pawline-needle-native]
codegen-units = 1
