[package]
name = "pawline-core"
version = "0.1.0"
edition = "2021"
description = "Pawline zero-LLM assistant engine: deterministic intent parsing, context, planning, validation and safe execution."
license = "Apache-2.0"

[dependencies]
cap-std = "3"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2.191"
serde_json = "1.0.154"
ureq = "3.5.2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
