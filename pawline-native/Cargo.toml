[package]
name = "pawline-native"
version = "0.2.0-beta"
edition = "2021"
description = "Pawline native Wayland UI: CPU-rendered (no OpenGL, no GTK, no WebKit)"
license = "GPL-3.0-only"

[[bin]]
name = "pawline"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = "0.19"
tiny-skia = "0.11"
fontdue = "0.9"
x11-dl = "2.21"
pawline-core = { path = "../pawline-core" }
pawline-needle = { path = "../pawline-needle" }
pawline-voice = { path = "../pawline-voice" }

[features]
# Release builds only: compile the four pinned runtime libs into the executable.
# Needs PAWLINE_VOICE_EMBED_DIR pointing at a folder holding them; hashes are checked at load.
embed-voice = []
