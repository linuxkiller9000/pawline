[package]
name = "pawline-native"
version = "0.3.0-test.1"
edition = "2021"
description = "Pawline native Wayland UI: CPU-rendered (no OpenGL, no GTK, no WebKit)"
license = "GPL-3.0-only"

[[bin]]
name = "pawline"
path = "src/main.rs"

[dependencies]
tiny-skia = "0.11"
fontdue = "0.9"
pawline-core = { path = "../pawline-core" }
# In-process llama.cpp engine (a stub unless built with the "engine" feature).
pawline-llama = { path = "../pawline-llama" }
pawline-needle = { path = "../pawline-needle" }
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
image-webp = { version = "0.2", default-features = false }
rustybuzz = "0.20"
unicode-bidi = "0.3"

calloop = "0.14"

[features]
default = ["laya"]
# Build llama.cpp into the binary: the no-install fallback when no llama-server
# is present. Off by default so an ordinary build needs no C++ toolchain.
engine = ["pawline-llama/vendored"]
# Experimental Laya intent router (Linux only): tract + tokenizers never build for Windows.
laya = ["dep:tract-onnx", "dep:tokenizers", "dep:regex"]

[target.'cfg(not(windows))'.dependencies]
tract-onnx = { version = "0.23", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
regex = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
smithay-client-toolkit = "0.21"
x11rb = { version = "0.14", default-features = false, features = ["shape"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_HiDpi"] }
