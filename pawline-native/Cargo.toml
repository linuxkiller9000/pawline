[package]
name = "pawline-native"
version = "0.3.0-test.1"
edition = "2021"
description = "Pawline native Wayland UI: CPU-rendered (no OpenGL, no GTK, no WebKit)"
license = "GPL-3.0-only"

[[bin]]
name = "pawline"
path = "src/main.rs"

[dependencies]
tiny-skia = "0.11"
fontdue = "0.9"
pawline-core = { path = "../pawline-core" }
pawline-needle = { path = "../pawline-needle" }
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
image-webp = { version = "0.2", default-features = false }
rustybuzz = "0.20"
unicode-bidi = "0.3"

calloop = "0.14"

[target.'cfg(unix)'.dependencies]
smithay-client-toolkit = "0.21"
x11rb = { version = "0.14", default-features = false, features = ["shape"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_HiDpi"] }
