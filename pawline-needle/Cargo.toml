[package]
name = "pawline-needle"
version = "0.1.0"
edition = "2021"
description = "Pawline embedded assist: Needle3 tool-calling model via the Cactus runtime, weights compiled into the binary. Additive to pawline-core; proposals re-enter validation."
license = "Apache-2.0"
links = "cactus"

[dependencies]
pawline-core = { path = "../pawline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
