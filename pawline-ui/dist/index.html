<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body { font: 14px/1.45 system-ui, sans-serif; color: #dbe7ff; }
  #shell {
    height: 100vh; display: flex; flex-direction: column;
    background: linear-gradient(160deg, #0b1020 0%, #101a33 55%, #1a1140 100%);
    border: 1px solid #2a4670; border-radius: 24px; overflow: hidden;
  }
  #compact {
    display: flex; align-items: center; justify-content: center; gap: 9px; padding: 10px 14px; cursor: pointer;
  }
  body:not(.expanded) #shell { border-radius: 50%; }
  body:not(.expanded) #compact { padding: 0; height: 100%; }
  body:not(.expanded) #dot { width: 42px; height: 42px; box-shadow: 0 0 20px #38bdf899; }
  body:not(.expanded) #hint { display: none; }
  body.expanded #compact { justify-content: flex-start; }
  #dot {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #7dd3fc, #6366f1 70%, #312e81);
    box-shadow: 0 0 14px #38bdf866;
  }
  #hint { color: #8fa8cf; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat { display: none; flex-direction: column; flex: 1; min-height: 0; }
  body.expanded #chat { display: flex; }
  body.expanded #compact { cursor: default; border-bottom: 1px solid #223457; padding-bottom: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 92%; padding: 6px 11px; border-radius: 18px; white-space: pre-wrap; font-size: 13px; }
  .user { align-self: flex-end; background: #3b4b8f; border: 1px solid #4d63b8; }
  .paw { align-self: flex-start; background: #141f3d; border: 1px solid #2a3d68; }
  .paw.confirm { border-color: #7c3aed; background: #1d1440; }
  .paw.error, .paw.failed { border-color: #b45309; }
  #confirmrow { display: none; gap: 8px; align-self: flex-start; }
  #confirmrow.show { display: flex; }
  button { font: 13px system-ui; border-radius: 16px; padding: 5px 14px; cursor: pointer; border: 1px solid #33477a; background: #1a2a52; color: #cfe3ff; }
  #yes { background: #0369a1; border-color: #0ea5e9; }
  #inputrow { display: flex; gap: 8px; padding: 6px 12px 10px; }
  #in {
    flex: 1; background: #0d1730; color: #e6f0ff; border: 1px solid #2c4a80;
    border-radius: 18px; padding: 7px 13px; font: 13.5px system-ui; outline: none;
  }
  #in:focus { border-color: #22d3ee; box-shadow: 0 0 8px #22d3ee44; }
  #esc { color: #5f7bb0; font-size: 11px; text-align: right; padding: 0 16px 6px; display: none; }
  body.expanded #esc { display: block; }
</style>
</head>
<body>
<div id="shell">
  <div id="compact" title="Click to open Pawline">
    <div id="dot"></div>
    <div id="hint">Pawline — click and tell me what to do</div>
  </div>
  <div id="chat">
    <div id="log">
      <div id="confirmrow">
        <button id="yes">Do it</button>
        <button id="no">Cancel</button>
      </div>
    </div>
    <div id="inputrow">
      <input id="in" placeholder="make a folder called kitten paws" autocomplete="off">
      <button id="go">Send</button>
    </div>
    <div id="esc">Esc to collapse</div>
  </div>
</div>
<script>
const invoke =
  (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) ||
  (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke && window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__)) ||
  (() => Promise.reject('no tauri'));
const body = document.body, log = document.getElementById('log'),
      inp = document.getElementById('in'),
      confirmrow = document.getElementById('confirmrow'),
      hint = document.getElementById('hint');

function add(role, text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + role + (cls ? ' ' + cls : '');
  d.textContent = text;
  log.insertBefore(d, confirmrow);
  log.scrollTop = log.scrollHeight;
  if (role === 'paw') hint.textContent = text.split('\n')[0].slice(0, 60);
}

async function expand() {
  if (!body.classList.contains('expanded')) {
    body.classList.add('expanded');
    await invoke('set_mode', { expanded: true });
    inp.focus();
  }
}
async function collapse() {
  body.classList.remove('expanded');
  await invoke('set_mode', { expanded: false });
  inp.blur();
}

document.getElementById('compact').addEventListener('click', expand);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') collapse();
  if (confirmrow.classList.contains('show')) {
    const a = document.activeElement, yes = document.getElementById('yes'), no = document.getElementById('no');
    if (a === yes || a === no) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); (a === yes ? no : yes).focus(); }
      if (e.key === 'y' && a === yes) { e.preventDefault(); yes.click(); }
      if (e.key === 'n') { e.preventDefault(); no.click(); }
    }
  }
});

function show(r) {
  add('paw', r.text, r.kind);
  confirmrow.classList.toggle('show', r.kind === 'confirm');
  if (r.kind === 'confirm') { inp.blur(); document.getElementById('no').focus(); }
  else inp.focus();
}

async function send() {
  const t = inp.value.trim();
  if (!t) return;
  inp.value = '';
  add('user', t);
  confirmrow.classList.remove('show');
  try { show(await invoke('send', { text: t })); }
  catch (e) { add('paw', String(e), 'error'); }
}
document.getElementById('go').addEventListener('click', send);
inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('yes').addEventListener('click', async () => {
  confirmrow.classList.remove('show');
  show(await invoke('confirm'));
});
document.getElementById('no').addEventListener('click', async () => {
  confirmrow.classList.remove('show');
  show(await invoke('cancel'));
});

add('paw', 'Hi, I am Pawline. Try: make a folder called kitten paws');
function tryExpand(n) {
  if (window.__pawline_start_expanded || location.hash === '#expanded') {
    body.classList.add('expanded'); inp.focus();
  } else if (n > 0) { setTimeout(() => tryExpand(n - 1), 300); }
}
tryExpand(10);
if (location.hash === '#expanded') { body.classList.add('expanded'); inp.focus(); }
</script>
</body>
</html>
